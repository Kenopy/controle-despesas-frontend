<div class="flex flex-col h-full w-full shadow-md bg-nav rounded-3xl overflow-hidden">
  <div class="flex-1 w-full overflow-auto">
    <table mat-table [dataSource]="dataSource" class="w-full rounded-3xl !bg-nav">

    <ng-container matColumnDef="data">
      <th mat-header-cell *matHeaderCellDef class="!text-texto !text-center font-bold border-b border-texto/20"> Data </th>
      <td mat-cell *matCellDef="let element" class="!text-texto !text-center border-b border-texto/10"> {{element.data}} </td>
    </ng-container>

    <ng-container matColumnDef="descricao">
      <th mat-header-cell *matHeaderCellDef class="!text-texto !text-center font-bold border-b border-texto/20"> Descrição </th>
      <td mat-cell *matCellDef="let element" class="!text-texto !text-center border-b border-texto/10"> {{element.descricao}} </td>
    </ng-container>

    <ng-container matColumnDef="categoria">
      <th mat-header-cell *matHeaderCellDef class="!text-texto !text-center font-bold border-b border-texto/20"> Categoria </th>
      <td mat-cell *matCellDef="let element" class="!text-center border-b border-texto/10">
        <span class="inline-flex items-center gap-1 px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wider"
              [ngClass]="getCategoriaStyle(element.categoria)">
          {{element.categoria}}
        </span>
      </td>
    </ng-container>

    <ng-container matColumnDef="formaPagamento">
      <th mat-header-cell *matHeaderCellDef class="!text-texto !text-center font-bold border-b border-texto/20"> Forma de pagamento </th>
      <td mat-cell *matCellDef="let element" class="!text-texto !text-center border-b border-texto/10"> {{element.formaPagamento}} </td>
    </ng-container>
    
    <ng-container matColumnDef="numeroParcelas">
      <th mat-header-cell *matHeaderCellDef class="!text-texto !text-center font-bold border-b border-texto/20"> Parcelas </th>
      <td mat-cell *matCellDef="let element" class="!text-texto !text-center border-b border-texto/10"> 
        {{element.numeroParcelas}}x 
      </td>
    </ng-container>

    <ng-container matColumnDef="valor">
      <th mat-header-cell *matHeaderCellDef class="!text-texto !text-center font-bold border-b border-texto/20"> Valor </th>
      <td mat-cell *matCellDef="let element" class="!text-texto !text-center border-b border-texto/10">
        {{ element.valor | currency:'BRL':'symbol':'1.2-2' }}
      </td>
    </ng-container>

    <ng-container matColumnDef="acoes">
      <th mat-header-cell *matHeaderCellDef class="!text-texto !text-center font-bold border-b border-texto/20"> Ações </th>
      <td mat-cell *matCellDef="let element" class="!text-center border-b border-texto/10">
        <div class="flex justify-center items-center gap-2">
          
          <button class="p-1.5 text-blue-400 border border-blue-400/30 bg-blue-400/10 rounded-md hover:bg-blue-400/20 transition-colors cursor-pointer">
            <ng-icon name="phosphorPencil" class="text-lg"></ng-icon>
          </button>
          
          <button class="p-1.5 text-red-400 border border-red-400/30 bg-red-400/10 rounded-md hover:bg-red-400/20 transition-colors cursor-pointer">
            <ng-icon name="phosphorTrash" class="text-lg"></ng-icon>
          </button>

        </div>
      </td>
    </ng-container>


      <tr mat-header-row *matHeaderRowDef="displayedColumns" class="bg-nav"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;" class="bg-nav hover:bg-texto/5 transition-colors cursor-pointer"></tr>

    </table>
  </div>
  <div class="w-full border-t border-texto/10">
    <mat-paginator [pageSizeOptions]="[10, 50, 100]"
                  showFirstLastButtons
                  aria-label="Select page of periodic elements"
                  class="!bg-nav !text-texto">
    </mat-paginator>
  </div>
</div>
